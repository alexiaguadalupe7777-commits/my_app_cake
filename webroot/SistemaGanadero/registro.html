<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Animal</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f4f6f9;
}

.header{
background:#2e7d32;
color:white;
padding:15px 20px;
}

.container{
max-width:700px;
margin:auto;
padding:40px;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
margin-top:0;
color:#1b5e20;
}

label{
font-weight:bold;
}

input{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:15px;
border-radius:5px;
border:1px solid #ccc;
}

button{
background:#2e7d32;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1b5e20;
}

</style>

</head>
<body>

<div class="header">
<h1>🐄 Sistema de Gestión Ganadera</h1>
</div>

<div class="container">

<div class="card">

<h2>Registro de Animal</h2>

<form action="guardar_animal.php" method="POST" enctype="multipart/form-data">

<label>Número de Arete</label>
<input type="text" name="arete" required>

<label>Peso Inicial (kg)</label>
<input type="number" step="0.01" name="peso_inicial">

<label>Peso Final (kg)</label>
<input type="number" step="0.01" name="peso_final">

<label>Días de confinamiento</label>
<input type="number" name="dias">

<label>Costo Inicial</label>
<input type="number" step="0.01" name="costo">

<label>Precio Final</label>
<input type="number" step="0.01" name="precio">

<label>Origen del animal</label>
<input type="text" name="origen">

<label>Foto del animal</label>
<input type="file" name="foto">

<button type="submit">Guardar Registro</button>

</form>

</div>

</div>

</body>
</html>
