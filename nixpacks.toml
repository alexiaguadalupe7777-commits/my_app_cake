[variables]
NIXPACKS_PHP_ROOT_DIR = "/app"

[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.intl",
  "php82Extensions.mbstring",
  "php82Extensions.pdo_mysql",
  "composer"
]

[phases.install]
cmds = [
  "composer install --ignore-platform-req=ext-intl --optimize-autoloader --no-interaction"
]
[phases.build]
cmds = [
  "mkdir -p tmp/cache/models tmp/cache/persistent tmp/cache/views tmp/sessions logs",
  "chmod -R 775 tmp logs",
  "chmod +x bin/cake bin/cake.php"
]

[deploy]
startCommand = "sh -c 'php bin/cake.php server -H 0.0.0.0 -p ${PORT:-8080}'"